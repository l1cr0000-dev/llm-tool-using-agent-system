[project]
name = "llm-tool-agent-system"
version = "0.2.0"
description = "LangGraph-based LLM tool-using agent with planning, memory, recovery, RAG, and Dify comparison."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
tool-agent = "tool_agent.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tool_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
